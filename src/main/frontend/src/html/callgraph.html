<!DOCTYPE html>
<html lang="en">

<head>
    <title>CallGraph - Liquid Glass Interface</title>
    <style type="text/css">
        /* Liquid Glass Theme */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1d35 25%, #0f1419 50%, #000000 100%);
            background-attachment: fixed;
            position: relative;
        }

        /* Animated background overlay for depth */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.03) 0%, transparent 50%);
            pointer-events: none;
            animation: shimmer 15s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Respect user's motion preferences */
        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
                opacity: 0.4;
            }
            
            .glass-panel::before {
                animation: none;
            }
            
            .glass-button, .navbutton {
                transition: none;
            }
            
            .glass-button::before, .navbutton::before {
                transition: none;
            }
        }

        #network {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Glass panel base style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.05), 
                transparent);
            animation: glass-shine 8s ease-in-out infinite;
        }

        @keyframes glass-shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .centeredMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5em;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 32px 48px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 600px;
        }

        .hidden {
            display: none !important;
        }

        /* Liquid glass button base */
        .glass-button {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85em;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.3);
            color: rgba(255, 255, 255, 1);
            box-shadow: 0 8px 24px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .glass-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .glass-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.15);
        }

        /* Navigation panels */
        .navbar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .navbar-right {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .button-group {
            display: flex;
            gap: 4px;
        }

        .buttonAndMessageContainer {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .navbutton {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.85em;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .navbutton::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .navbutton:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.3);
            color: rgba(255, 255, 255, 1);
            box-shadow: 0 8px 24px rgba(0, 255, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .navbutton:hover::before {
            width: 300px;
            height: 300px;
        }

        .navbutton:active {
            transform: translateY(0);
        }

        .navbuttonMessage {
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .navbuttonMessage-success {
            background: rgba(42, 255, 150, 0.15);
            color: rgba(42, 255, 150, 1);
            border-color: rgba(42, 255, 150, 0.3);
            box-shadow: 0 4px 16px rgba(42, 255, 150, 0.2);
        }

        .navbuttonMessage-error {
            background: rgba(255, 100, 120, 0.15);
            color: rgba(255, 150, 170, 1);
            border-color: rgba(255, 100, 120, 0.3);
            box-shadow: 0 4px 16px rgba(255, 100, 120, 0.2);
        }

        .button-icon {
            margin-right: 8px;
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* Floating glow effect on icons */
        .navbutton:hover .button-icon {
            opacity: 1;
            filter: drop-shadow(0 0 4px rgba(0, 255, 255, 0.6));
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .navbar, .navbar-right {
                top: 8px;
            }
            
            .navbar {
                left: 8px;
            }
            
            .navbar-right {
                right: 8px;
            }
            
            .navbutton {
                font-size: 0.75em;
                padding: 8px 14px;
            }
            
            .centeredMessage {
                font-size: 1.2em;
                padding: 24px 32px;
            }
        }

        /* Smooth scrollbar for panels */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: background 0.3s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
<div id="message" class="centeredMessage hidden"></div>
<div id="network"></div>
<div id="navbar" class="navbar">
    <div class="button-group">
        <div class="buttonAndMessageContainer" onclick="JavaBridge.generateGraph()">
            <button class="navbutton">
                <i class="fas fa-magic button-icon"></i>GENERATE
            </button>
            <span id="generateMessage" class="navbuttonMessage"></span>
        </div>
    </div>
    
    <div class="button-group">
        <button class="navbutton generatedGraphController hidden" onclick="fit()">
            <i class="fas fa-expand-arrows-alt button-icon"></i>FIT
        </button>
    </div>
    
    <div class="button-group">
        <button class="navbutton generatedGraphController hidden" onclick="hideSelectedNode()">
            <i class="fas fa-eye-slash button-icon"></i>HIDE NODE
        </button>
    </div>
    
    <div class="button-group">
        <button class="navbutton hidden" id="showAllButton" onclick="showAllNodes()">
            <i class="fas fa-eye button-icon"></i>SHOW ALL
        </button>
    </div>
</div>

<div id="navbar-right" class="navbar-right">
    <div class="button-group">
        <button class="navbutton" onclick="JavaBridge.openSettings()">
            <i class="fas fa-cog button-icon"></i>OPTIONS
        </button>
    </div>
    
    <div class="button-group">
        <button class="navbutton generatedGraphController hidden" onclick="JavaBridge.saveAsHtml()">
            <i class="fas fa-download button-icon"></i>SAVE AS HTML
        </button>
    </div>
</div>

<script defer="defer">
    <% /*
        The following line is a workaround for scripts that insert .js code into the generated .html file.
        Because this is set here, "inject: false" is set in webpack-config.js in plugins.HtmlWebpackPlugin
        */ %>
    <%= compilation.assets[webpackConfig.output.filename].source() %>
</script>
</body>

</html>
